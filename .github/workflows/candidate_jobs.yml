name: Candidate Job Pipeline V5

on:
  workflow_dispatch:
  schedule:
    - cron: "7 */6 * * *"

concurrency:
  group: candidate-job-pipeline-v5
  cancel-in-progress: false

jobs:
  candidate-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate CandidateJobs pipeline
        run: python candidate_jobs.py --self-test

      - name: Build CandidateJobs and RejectedJobs
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SOURCES_TAB: Sources
          GOOGLE_CANDIDATE_TAB: CandidateJobs
          GOOGLE_REJECTED_TAB: RejectedJobs
        run: python candidate_jobs.py

      - name: Validate showable output report
        run: python report_output.py --self-test

      - name: Update showable candidate output
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_TAB: Sheet1
          GOOGLE_META_TAB: _CollectorMeta
          GOOGLE_SOURCES_TAB: Sources
          GOOGLE_CANDIDATE_TAB: CandidateJobs
          GOOGLE_REJECTED_TAB: RejectedJobs
          GOOGLE_REPORT_TAB: AutomationOutput
        run: python report_output.py --workflow candidate-job-pipeline
