name: Daily Architect Source Discovery V4.4.2

on:
  workflow_dispatch:
  schedule:
    - cron: "35 20 * * *"

concurrency:
  group: architect-source-discovery-v442
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate discovery
        run: python discovery.py --self-test

      - name: Discover public architecture career sources
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SOURCES_TAB: Sources
        run: python discovery.py

      - name: Validate ATS discovery
        run: python ats_discovery.py --self-test

      - name: Discover public ATS boards
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SOURCES_TAB: Sources
        run: python ats_discovery.py

      - name: Validate showable output report
        run: python report_output.py --self-test

      - name: Update showable discovery output
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_TAB: Sheet1
          GOOGLE_META_TAB: _CollectorMeta
          GOOGLE_SOURCES_TAB: Sources
          GOOGLE_REPORT_TAB: AutomationOutput
        run: python report_output.py --workflow daily-source-discovery
