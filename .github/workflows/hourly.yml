name: Hourly Architect Job Collector V3

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: architect-job-collector-v3
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate V3 rules and schema
        run: python collector.py --self-test

      - name: Run V3 collector
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

          # This keeps using your current Google Sheet tab.
          # V3 clears its old V2 rows/headers and rewrites only website-ready jobs.
          GOOGLE_SHEET_TAB: Sheet1

          # Internal automation history is kept separately.
          GOOGLE_META_TAB: _CollectorMeta
        run: python collector.py
