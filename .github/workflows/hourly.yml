name: Hourly Architect Job Collector V4.4.6

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: architect-job-collector-v446
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate V4.4.6 rules
        run: python collector.py --self-test

      - name: Run V4.4.6 collector
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_TAB: Sheet1
          GOOGLE_META_TAB: _CollectorMeta
          GOOGLE_SOURCES_TAB: Sources
        run: python collector.py

      - name: Validate showable output report
        run: python report_output.py --self-test

      - name: Update showable automation output
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_TAB: Sheet1
          GOOGLE_META_TAB: _CollectorMeta
          GOOGLE_SOURCES_TAB: Sources
          GOOGLE_REPORT_TAB: AutomationOutput
        run: python report_output.py --workflow hourly-collector
