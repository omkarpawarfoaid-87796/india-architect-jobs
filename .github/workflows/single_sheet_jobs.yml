name: Single Sheet Job Finder V7 Apply Link Mode

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: single-sheet-job-finder-v7-apply-link
  cancel-in-progress: false

jobs:
  single-sheet-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate V7 apply-link rules
        run: python single_sheet_jobs.py --self-test

      - name: Run V7 single-sheet apply-link finder
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_TAB: Sheet1
        run: python single_sheet_jobs.py
