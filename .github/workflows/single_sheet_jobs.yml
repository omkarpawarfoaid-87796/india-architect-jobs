name: Single Sheet Job Finder V8.1 Clean Apply Link

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: single-sheet-job-finder-v8-1-clean-apply-link
  cancel-in-progress: false

jobs:
  single-sheet-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate V8.1 clean apply-link rules
        run: python single_sheet_jobs.py --self-test

      - name: Run V8.1 clean apply-link finder
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_TAB: Sheet1
        run: python single_sheet_jobs.py
