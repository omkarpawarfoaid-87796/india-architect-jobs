revalidate_limit_per_run: 250


# Website export settings
# employer_author currently uses the company name. If the web developer later
# requires a WordPress employer user ID/username, change the mapping in collector.py.
employer_author_mode: "company_name"


# V3.1 website safety expiry
# Real employer deadlines remain in application_deadline_date.
# Undated but verified-open jobs receive a rolling website expiry that is
# refreshed after every successful collector run.
website_rolling_expiry_days: 7


# -------------------------------------------------------------------
# V4 Sources registry + scale controls
# -------------------------------------------------------------------
hourly_source_batch_size: 80
source_disable_after_failures: 8

# Daily automatic discovery. The discovery workflow rotates through these
# cities so the free search volume stays controlled while coverage grows.
discovery_cities:
