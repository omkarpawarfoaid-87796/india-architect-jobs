# -------------------------------------------------------------------
# V6 Single Sheet Only
# -------------------------------------------------------------------
v6_single_sheet_only: true
sheet_tab: Sheet1

# V6 will not create or use CandidateJobs, RejectedJobs, Sources,
# AutomationOutput, or _CollectorMeta. Set this true if you want V6 to delete
# old tabs created by earlier versions after a successful Sheet1 write.
delete_old_pipeline_tabs: true
old_pipeline_tabs_to_delete:
  - CandidateJobs
  - RejectedJobs
  - AutomationOutput
  - Sources
  - _CollectorMeta

# Search wider but publish only real verified jobs to Sheet1.
v6_max_queries_per_run: 30
v6_results_per_query: 8
v6_max_discovered_sources_per_run: 40
v6_signal_resolve_queries: 2
v6_official_sources_per_signal: 2
v6_max_sources_to_scan: 70
v6_search_delay_seconds: 0.2

