# -------------------------------------------------------------------
# These are legitimate design employers that may not describe themselves as
# traditional architecture studios. They still need independent India evidence
# and a public careers page.
trusted_design_employer_domains:
  - livspace.com


# -------------------------------------------------------------------
# V4.4 Public ATS coverage
# -------------------------------------------------------------------
