# Architect Jobs Collector V6.2 — Single Sheet Clean Quantity Mode
# India-only architecture/design jobs.
# Freshness rule requested by user:
# - Never accept a dated job posted before 2026-09-01.
# - Undated jobs are accepted only when the vacancy is clearly live and publicly applyable.
# - Closed/expired jobs are rejected even if they are newer than the cutoff.

minimum_posted_date: "2026-09-01"
accept_undated_if_live_verified: true
undated_min_description_chars: 100
undated_min_evidence_score: 6
verify_apply_urls: true
revalidate_existing_jobs: true

keywords:
  include:
    - architect
    - architecture
    - architectural
    - junior architect
    - senior architect
    - project architect
    - design architect
    - interior architect
    - interior designer
    - landscape architect
    - urban designer
    - urban planner
    - bim architect
    - bim coordinator
    - revit architect
    - architectural designer
    - 3d visualizer
    - visualizer
  exclude:
    - software architect
    - solutions architect
    - solution architect
    - cloud architect
    - enterprise architect
    - data architect
    - security architect
    - network architect
    - technical architect
    - systems architect
    - application architect
    - platform architect
    - infrastructure architect
    - aws architect
    - azure architect

skill_terms:
  - AutoCAD
  - Revit
  - SketchUp
  - Rhino
  - Grasshopper
  - BIM
  - Lumion
  - Enscape
  - V-Ray
  - 3ds Max
  - Photoshop
  - Illustrator
