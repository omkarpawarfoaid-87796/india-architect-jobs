direct_job_page_min_hiring_terms: 1
fresh_direct_job_pages_enabled: true


# -------------------------------------------------------------------
# V5 hard cleanup
# -------------------------------------------------------------------
v445_hard_cleanup_enabled: true
service_page_noise_reject_score: 5


# -------------------------------------------------------------------
# V5 timeout-safe cleanup overrides
# -------------------------------------------------------------------
request_timeout_seconds: 8
request_delay_seconds: 0.05
source_workers: 4
hourly_source_batch_size: 30
max_sources_per_run: 30
max_job_links_per_source: 8
max_pages_per_source: 8
source_future_timeout_seconds: 45
revalidate_limit_per_run: 20
max_description_chars: 1800
service_page_noise_reject_score: 6


# -------------------------------------------------------------------
# V5 CandidateJobs pipeline
# -------------------------------------------------------------------
candidate_jobs_tab: CandidateJobs
rejected_jobs_tab: RejectedJobs
candidate_roles_per_run: 8
candidate_cities_per_run: 5
candidate_max_queries_per_run: 40
candidate_max_candidates_per_run: 100
candidate_max_rejected_per_run: 120
candidate_request_delay_seconds: 0.6

# V5 keeps LinkedIn/job boards as signals only.
# They are never written as final apply_url in Sheet1.
candidate_use_linkedin_signals: true
candidate_use_job_board_signals: true
